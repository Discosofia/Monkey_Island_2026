name: CI

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    name: Formato, lint y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar herramientas (versiones de rokit.toml)
        run: bash .github/scripts/install-tools.sh

      - name: Formato (StyLua)
        run: stylua --check src

      - name: Lint (Selene)
        run: selene src

      - name: Textos traducibles (tools/strings.py)
        run: python3 tools/strings.py

      - name: Un icono, una sola cosa (tools/icons.py)
        run: python3 tools/icons.py

      - name: Build de los places (Rojo)
        run: |
          mkdir -p build
          rojo build lobby.project.json --output build/lobby.rbxl
          rojo build island.project.json --output build/island.rbxl
          rojo build dunas.project.json --output build/dunas.rbxl
          rojo build laboratorio.project.json --output build/laboratorio.rbxl
